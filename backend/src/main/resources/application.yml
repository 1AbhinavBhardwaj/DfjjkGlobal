server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: dfjjk-backend
  
  datasource:
    # Persistent File-Based H2 Database Configuration
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/dfjjkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Disable H2 console in production to prevent exposing DB admin interface publicly
  h2:
    console:
      enabled: false

jwt:
  secret: DFJJKGlobalSuperSecretKeyForJWTSigningAndAuthenticationTokenValidation2026!
  expiration-ms: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.dfjjk: DEBUG
